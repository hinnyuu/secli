name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check flake
        run: nix flake check

      - name: Build host package
        run: nix build

      - name: Smoke test host package
        run: ./result/bin/secli --help

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build amd64 runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: localhost/secli:ci
          build-args: |
            SECLI_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            OCI_SOURCE=https://github.com/${{ github.repository }}

      - name: Smoke test runtime image
        run: |
          set -euo pipefail
          test "$(docker image inspect localhost/secli:ci --format '{{json .Config.Entrypoint}}')" = '["/entrypoint.sh"]'
          test "$(docker image inspect localhost/secli:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          docker run --rm --entrypoint /nix/var/nix/profiles/secli-base/bin/git localhost/secli:ci --version
          docker run --rm --entrypoint /nix/var/nix/profiles/secli-base/bin/rg localhost/secli:ci --version
          docker run --rm --entrypoint /bin/sh localhost/secli:ci -c \
            'test -x /entrypoint.sh && test ! -e /opt/secli/manifest && test ! -e /opt/secli/templates'
